<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Paper Scissors | YASH HUB</title>
<link rel="stylesheet" href="gaming.css">
<style>
.play{max-width:600px;margin:45px auto;padding:20px;text-align:center}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}
button{background:#241333;color:white;border:1px solid #a855f7;padding:16px 22px;border-radius:12px;font-size:18px}
button:active{background:#9333ea}
#result{font-size:22px;margin:22px}
</style>
</head>
<body>
<header><a class="logo" href="../index.html">YASH<span>HUB.</span></a><a class="back" href="index.html">← Gaming Zone</a></header>
<main class="play">
<h1>✊ ROCK PAPER SCISSORS</h1>
<p>Choose your move and challenge the computer!</p>
<div class="choices">
<button onclick="play('Rock')">✊ Rock</button>
<button onclick="play('Paper')">✋ Paper</button>
<button onclick="play('Scissors')">✌️ Scissors</button>
</div>
<div id="result">Make your move!</div>
<p id="score">You: 0 | Computer: 0 | Draws: 0</p>
<button onclick="resetGame()">Reset Game</button>
</main>
<script>
let you=0,computer=0,draws=0;
function play(choice){
 const options=['Rock','Paper','Scissors'];
 const cpu=options[Math.floor(Math.random()*3)];
 let message='';
 if(choice===cpu){draws++;message='It is a Draw!';}
 else if((choice==='Rock'&&cpu==='Scissors')||(choice==='Paper'&&cpu==='Rock')||(choice==='Scissors'&&cpu==='Paper')){you++;message='You Win! 🎉';}
 else{computer++;message='Computer Wins!';}
 document.getElementById('result').textContent='You: '+choice+' | Computer: '+cpu+' — '+message;
 update();
}
function update(){document.getElementById('score').textContent=`You: ${you} | Computer: ${computer} | Draws: ${draws}`;}
function resetGame(){you=0;computer=0;draws=0;document.getElementById('result').textContent='Make your move!';update();}
</script>
</body>
</html>
